<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15121B" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Mash Potato — your group's shared definition of a good movie. Rate blind, reveal together, get one Mashed score."
    />
    <title>Mash Potato</title>

    <!-- Fonts: Fraunces (display + big scores), Hanken Grotesk (UI/body), Space Mono (numeric readouts).
         NOTE: loaded from Google Fonts for the M0 theme check. Before the Capacitor release build
         these should be self-hosted (e.g. @fontsource) so the packaged app works offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Hanken+Grotesk:wght@400..700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Startup-crash net: if the app JS throws before React ever mounts (e.g.
         missing env config in a release build), #root stays empty forever with
         no visible signal. This shows the actual error instead of a blank
         screen — critical on iOS where there's no console to check. -->
    <script>
      (function () {
        function show(msg) {
          var root = document.getElementById('root')
          if (root && root.childElementCount === 0) {
            root.innerHTML =
              '<div style="min-height:100dvh;display:flex;flex-direction:column;' +
              'align-items:center;justify-content:center;padding:24px;text-align:center;' +
              'font-family:-apple-system,system-ui,sans-serif;color:#f3eee5;">' +
              '<p style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;' +
              "color:#9c93ab;margin-bottom:12px;\">Mash Potato couldn't start</p>" +
              '<p style="max-width:320px;font-size:13px;line-height:1.5;color:#e07a5f;">' +
              msg +
              '</p></div>'
          }
        }
        window.addEventListener('error', function (e) {
          show((e && e.message) || 'Unknown startup error.')
        })
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason
          show((reason && reason.message) || String(reason) || 'Unknown startup error.')
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
