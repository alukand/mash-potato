<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No `maximum-scale` / `user-scalable=no`: this ships to browsers now,
         and blocking pinch-zoom on the web denies people who need to magnify
         text any way to read it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The CSP lives in public/_headers, NOT here. This file also ships
         inside the native app, where the origin is capacitor://localhost and a
         web-shaped policy would be wrong. Headers apply to the web origin
         only, which is exactly the scope that wants them. -->
    <meta name="theme-color" content="#15121B" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Mash Potato — your group's shared definition of a good movie. Rate blind, reveal together, get one Mashed score."
    />
    <title>Mash Potato</title>
    <!-- iOS ignores SVG for home-screen icons, so this one is a real PNG,
         rendered from favicon.svg onto the brand background (a transparent
         icon gets composited onto whatever tile iOS feels like). -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews. Without these a shared mashpotato.app link unfurls as
         bare text, which wastes the one moment someone is deciding to click. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mash Potato" />
    <meta property="og:title" content="Mash Potato" />
    <meta
      property="og:description"
      content="Your group's shared definition of a good movie. Rate blind, reveal together, get one Mashed score."
    />
    <meta property="og:url" content="https://app.mashpotato.app/" />
    <meta property="og:image" content="https://mashpotato.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Bricolage Grotesque (display + big scores — warm, characterful,
         nobody else's movie app), Hanken Grotesk (UI/body), Azeret Mono
         (numeric readouts + micro-labels; inherently tabular).
         NOTE: loaded from Google Fonts for now. Before the Capacitor release
         build these should be self-hosted (e.g. @fontsource) so the packaged
         app works offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..700&family=Azeret+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Startup-crash net. In public/boot.js rather than inline so a strict
         `script-src 'self'` CSP covers it without a hash that would silently
         break whenever the script is edited. -->
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
