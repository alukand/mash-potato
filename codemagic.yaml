# Codemagic CI — build the Capacitor iOS app and ship it to TestFlight from a
# cloud macOS machine (no local Mac required). One-time setup in Codemagic:
#
#   1. Connect this GitHub repo to a Codemagic app.
#   2. Team → Integrations → App Store Connect: upload an App Store Connect API
#      key (App Store Connect → Users and Access → Integrations → App Store
#      Connect API, role "App Manager"). Note the integration name and put it in
#      `integrations.app_store_connect` below (replace CHANGE_ME_ASC_KEY).
#   3. Add a variable group named "mashpotato_env" with:
#        VITE_SUPABASE_URL       = https://lvmcwvhlfijvegxbqipc.supabase.co
#        VITE_SUPABASE_ANON_KEY  = <the anon key from .env.production>
#      (These are build-time public values; the anon key is safe to expose.)
#   4. After you create the app record in App Store Connect, set APP_APPLE_ID
#      below to its numeric Apple ID (App Store Connect → App → App Information).
#
# Signing uses automatic code signing driven by the App Store Connect API key,
# so no manual certificates/profiles are needed.

workflows:
  ios-testflight:
    name: Mash Potato — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Mash Potato"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.mashpotato.app"
        APP_APPLE_ID: 6788610092 # Apple ID of the App Store Connect record
      groups:
        - mashpotato_env
      node: 22 # Capacitor 8 CLI requires Node >= 22
      xcode: latest
      # Capacitor 8 uses Swift Package Manager, not CocoaPods — no pods step.
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Write .env.production from CI vars
        script: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "FATAL: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are empty."
            echo "Check that the 'mashpotato_env' variable group exists on this"
            echo "app in Codemagic and contains both variables (exact names)."
            exit 1
          fi
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          EOF
      - name: Build web bundle and sync into the iOS project
        script: |
          npm run build
          # Fail loudly if Vite didn't actually embed the Supabase URL — a
          # silently-missing env var here produces an app that installs fine
          # but shows a blank screen at runtime (no console on iOS to catch it).
          if ! grep -q "$VITE_SUPABASE_URL" dist/assets/*.js; then
            echo "FATAL: VITE_SUPABASE_URL was not embedded in the built bundle."
            exit 1
          fi
          npx cap sync ios
      - name: Fetch (creating if missing) signing files, set up keychain
        script: |
          keychain initialize
          # Create/reuse the distribution certificate from the private key stored
          # as the secure CERTIFICATE_PRIVATE_KEY variable, and create the
          # App Store provisioning profile if it doesn't exist yet.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number to the Codemagic build index
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only — the build is then immediately available to Internal
        # Testing with no beta review. For EXTERNAL testers, set this to true and
        # fill in Beta App Review info in App Store Connect (TestFlight → Test
        # Information: feedback email + review contact name/phone/email).
        submit_to_testflight: false
