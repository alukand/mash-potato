# Codemagic CI — build the Capacitor iOS app and ship it to TestFlight from a
# cloud macOS machine (no local Mac required). One-time setup in Codemagic:
#
#   1. Connect this GitHub repo to a Codemagic app.
#   2. Team → Integrations → App Store Connect: upload an App Store Connect API
#      key (App Store Connect → Users and Access → Integrations → App Store
#      Connect API, role "App Manager"). Note the integration name and put it in
#      `integrations.app_store_connect` below (replace CHANGE_ME_ASC_KEY).
#   3. Add a variable group named "mashpotato_env" with:
#        VITE_SUPABASE_URL       = https://lvmcwvhlfijvegxbqipc.supabase.co
#        VITE_SUPABASE_ANON_KEY  = <the anon key from .env.production>
#      (These are build-time public values; the anon key is safe to expose.)
#   4. After you create the app record in App Store Connect, set APP_APPLE_ID
#      below to its numeric Apple ID (App Store Connect → App → App Information).
#
# Signing uses automatic code signing driven by the App Store Connect API key,
# so no manual certificates/profiles are needed.

workflows:
  ios-testflight:
    name: Mash Potato — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Mash Potato"
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.mashpotato.app"
        APP_APPLE_ID: 6788610092 # Apple ID of the App Store Connect record
      groups:
        - mashpotato_env
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Write .env.production from CI vars
        script: |
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          EOF
      - name: Build web bundle and sync into the iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Fetch (creating if missing) signing files, set up keychain
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number to the Codemagic build index
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
